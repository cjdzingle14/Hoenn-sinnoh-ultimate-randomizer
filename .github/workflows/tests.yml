name: Project tests and engine baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  randomizer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run project tests
        run: python -m pytest -q

  engine-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned engine submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pokeemerald-expansion build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi git libpng-dev python3
      - name: Record pinned engine revision
        run: |
          git -C vendor/pokeemerald-expansion rev-parse HEAD
          arm-none-eabi-gcc --version
      - name: Build unmodified upstream engine
        working-directory: vendor/pokeemerald-expansion
        run: make -j2
