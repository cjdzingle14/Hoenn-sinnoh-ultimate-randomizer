name: Project tests and custom engine build

on:
  push:
    branches: [main, overworld/hd-inspired-palette-pass]
  pull_request:
    branches: [main, test4/sprite-polish-pipeline]
  workflow_dispatch:

jobs:
  randomizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest Pillow
      - run: python -m pytest -q

  engine-custom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned engine submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install engine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi git libpng-dev python3
      - name: Install sprite audit dependency
        run: python -m pip install Pillow
      - name: Audit GBA sprite palettes and transparency
        run: python -m tools.sprite_polish --engine-dir vendor/pokeemerald-expansion
      - name: Record pinned engine revision
        run: |
          git -C vendor/pokeemerald-expansion rev-parse HEAD
          arm-none-eabi-gcc --version
      - name: Apply HD-inspired overworld tileset palette polish
        run: python -m tools.integrate_overworld_polish --engine-dir vendor/pokeemerald-expansion
      - name: Apply HD-inspired overworld tileset palette polish
        run: python -m tools.integrate_overworld_polish --engine-dir vendor/pokeemerald-expansion
      - name: Apply per-new-game randomized starter choices
        run: python -m tools.integrate_starters --engine-dir vendor/pokeemerald-expansion
      - name: Integrate runtime wild and trainer randomization
        run: python -m tools.integrate_runtime_randomizers --engine-dir vendor/pokeemerald-expansion
      - name: Configure rival 10 Poké Ball gift
        run: python -m tools.integrate_encounters --engine-dir vendor/pokeemerald-expansion
      - name: Apply streamlined Nurse Joy healing flow
        run: python -m tools.integrate_nurse_joy --engine-dir vendor/pokeemerald-expansion
      - name: Apply reusable Technical Machines
        run: python -m tools.integrate_tm_hm --engine-dir vendor/pokeemerald-expansion
      - name: Apply HM item-based field move access
        run: python -m tools.integrate_hm_field --engine-dir vendor/pokeemerald-expansion
      - name: Build custom engine ROM
        working-directory: vendor/pokeemerald-expansion
        run: make -j2
      - name: Validate standard GBA header for emulator compatibility
        run: python -m tools.validate_gba_rom vendor/pokeemerald-expansion/pokeemerald.gba
      - name: Upload custom per-playthrough starter ROM
        uses: actions/upload-artifact@v4
        with:
          name: hoenn-sinnoh-test-build
          path: vendor/pokeemerald-expansion/pokeemerald.gba
          if-no-files-found: error
          retention-days: 14
